# SonarQube / SonarScanner Configuration
sonar.projectKey=pnam-it309_alpora
sonar.organization=pnam-it309

# Source and Test scopes
sonar.sources=poly_shell,scripts,shell,dotfiles,install
sonar.tests=tests

# Target Python runtime versions
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Exclude GTK CSS theme templates, fonts, and audit traces from web analysis
sonar.exclusions=assets/theme-templates/**,**/assets/theme-templates/**,docs/audits/traces/**,assets/fonts/**

# Exclude mockups and theme templates from Copy/Paste Detection (CPD)
sonar.cpd.exclusions=shell/demos/**,assets/theme-templates/**

# Ignore all CSS rules on GTK theme templates (GTK stylesheets use GTK-specific at-rules and node selectors)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:*
sonar.issue.ignore.multicriteria.e1.resourceKey=assets/theme-templates/**

