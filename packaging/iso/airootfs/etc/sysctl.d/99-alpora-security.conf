# ALPORA OS - Kernel Security Hardening
# Protect against pointer leaks, dmesg snooping, and unprivileged exploits

# Restrict dmesg access to root / sudo users
kernel.dmesg_restrict = 1

# Hide exposed kernel pointers from unprivileged users
kernel.kptr_restrict = 2

# Disable unprivileged eBPF to prevent speculative execution & side-channel attacks
kernel.unprivileged_bpf_disabled = 1

# Restrict ptrace scope to child processes (Yama LSM)
kernel.yama.ptrace_scope = 1

# Protect against symlink / hardlink / FIFO attacks in world-writable dirs (/tmp)
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Disable core dumps for setuid binaries
fs.suid_dumpable = 0

# Network stack hardening (SYN flood protection, Reverse Path Filtering)
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

