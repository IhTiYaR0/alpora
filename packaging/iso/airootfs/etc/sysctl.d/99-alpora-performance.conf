# ALPORA OS - Zero-Thrashing zRAM & Low-Latency Desktop Memory Tuning
# 1. Aggressively compress inactive memory into zRAM to preserve file cache
vm.swappiness = 180

# 2. Disable proactive memory watermarking boosts that trigger unnecessary scans
vm.watermark_boost_factor = 0

# 3. Scale memory watermarks to begin gentle reclaim before hard latency stalls
vm.watermark_scale_factor = 125

# 4. Read single pages with zero sequential read-ahead for instantaneous zRAM lookups
vm.page-cluster = 0

# 5. Retain dentries and directory caches in memory
vm.vfs_cache_pressure = 50

# 6. Support high mapping counts for Proton/Wine games and JetBrains JVMs
vm.max_map_count = 1048576

# 7. Balanced dirty pages flushing
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
