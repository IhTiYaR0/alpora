# ALPORA OS - Multi-Core CPU & Memory Optimization
# High frame stability for gaming (Hoyoverse ZZZ, Honkai) & lightweight desktop

# Retain active games & shell UI in physical RAM, prevent premature swapping
vm.swappiness = 10

# Maintain VFS directory and inode caches longer in memory
vm.vfs_cache_pressure = 50

# Expand virtual memory map limits required by Wine, Proton & modern 3D games
vm.max_map_count = 1048576

# Optimize dirty memory writeback intervals for modern NVMe/SSD storage
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

