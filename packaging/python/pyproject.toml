[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpora"
version = "1.0.0"
description = "Fast, coherent, multi-theme desktop environment and QuickShell companion for Hyprland"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "yamllint>=1.35.0",
]
