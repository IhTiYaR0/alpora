# Native Hyprlock/PAM; the landscape remains the composition, not a login card.
general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2200
}
animations {
    enabled = $lockMotion
    bezier = alpine, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, alpine
    animation = fadeOut, 1, 2, alpine
    animation = inputFieldColors, 1, 2, alpine
    animation = inputFieldDots, 1, 1.5, alpine
}
background {
    monitor =
    path = $lockWallpaper
    color = $lockBackground
    blur_passes = 0
    brightness = 0.70
    contrast = 1.0
    vibrancy = 0.0
    noise = 0.008
}
shape {
    monitor =
    size = 100%, 100%
    color = rgba(10181930)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Same sloped clock silhouette and triangulated ridges as TopBar.qml.
image {
    monitor =
    path = $lockClockFrame
    size = 144
    rounding = 0
    border_size = 0
    position = 0, 155
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = <span letter_spacing="3500">$TIME</span>
    color = $lockText
    font_family = $lockClockFont
    font_size = 62
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(10181955)
    position = 0, 170
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] $lockDateCommand
    color = $lockAccent
    font_family = $lockFont
    font_size = 11
    position = 0, 108
    halign = center
    valign = center
    zindex = 2
}

# Lockscreen Media Player: Album art, track title, artist and mini controls
image {
    monitor =
    path = /tmp/alpora-lock-art.png
    size = 80
    rounding = 12
    border_size = 1
    border_color = $lockEdge
    reload_time = 2
    reload_cmd = $lockMediaCommand art
    position = 0, 15
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] $lockMediaCommand title
    color = $lockText
    font_family = $lockClockFont
    font_size = 12
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(101819cc)
    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] $lockMediaCommand artist
    color = $lockMuted
    font_family = $lockFont
    font_size = 10
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(101819cc)
    position = 0, -58
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] $lockMediaCommand controls
    color = $lockAccent
    font_family = $lockFont
    font_size = 13
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(101819cc)
    position = 0, -78
    halign = center
    valign = center
    zindex = 2
}

# Separate compact authentication island leaves the alpine scene visible.
label {
    monitor =
    text = $USER
    color = $lockText
    font_family = $lockFont
    font_size = 12
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(101819cc)
    position = 0, -150
    halign = center
    valign = center
    zindex = 2
}
input-field {
    monitor =
    size = 292, 46
    position = 0, -194
    halign = center
    valign = center
    rounding = 8
    outline_thickness = 1
    outer_color = $lockEdge
    inner_color = $lockGlass
    font_color = $lockText
    font_family = $lockFont
    placeholder_text = Введите пароль
    check_text = Проверяем…
    fail_text = Не удалось войти · попробуй ещё раз
    check_color = $lockAccent
    fail_color = rgba(d18e82ff)
    capslock_color = $lockAmber
    bothlock_color = $lockAmber
    dots_size = 0.20
    dots_spacing = 0.30
    fade_on_empty = false
    swap_font_color = false
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(10181966)
    zindex = 3
}
label {
    monitor =
    text = $LAYOUT[EN,РУ]  ·  Enter для входа
    color = $lockText
    font_family = $lockFont
    font_size = 9
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(101819cc)
    position = 0, -238
    halign = center
    valign = center
    zindex = 2
}
