<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>ALPORA System Typography Defaults</description>

  <!-- Default font directories -->
  <dir prefix="xdg">fonts</dir>

  <!-- Default sans-serif font: Inter -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>

  <!-- Default monospace font: JetBrains Mono -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrains Mono</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>

  <!-- Default display font: Outfit -->
  <match target="pattern">
    <test qual="any" name="family"><string>display</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Outfit</string>
      <string>Inter</string>
    </edit>
  </match>

  <!-- System UI font alias -->
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <!-- Rendering hints for high clarity -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
