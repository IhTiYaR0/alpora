# ==============================================================================
# ALPORA Kitty Terminal Configuration (kitty.conf)
# ==============================================================================

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# Window padding and layout
window_padding_width 14
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0

# Transparency & background blur
background_opacity 0.92
dynamic_background_opacity yes

# Cursor
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Semantic ALPORA Palette
background #141a18
foreground #d6e0db
selection_background #859e92
selection_foreground #141a18
cursor #859e92

# black
color0 #1c2321
color8 #36433f

# red
color1 #c26960
color9 #d77f76

# green (ALPORA accent)
color2 #7ea286
color10 #94b89c

# yellow
color3 #cca372
color11 #e0b887

# blue
color4 #6890a8
color12 #7fa5bd

# magenta
color5 #9f7ca6
color13 #b593bc

# cyan
color6 #6d9fa1
color14 #84b5b7

# white
color7 #c7d2cd
color15 #ecf3f0

