[General]
DisableDefaultImports=false

[Warnings]
# Quickshell and its desktop plugins (Hyprland, Pipewire, Wayland, MPRIS, etc.)
# are native Wayland modules provided by Quickshell on Linux.
# Disable missing-import and unqualified warnings for external Wayland modules.
import=disable
ImportFailure=disable
unqualified=disable
UnqualifiedAccess=disable
uncreatable-type=disable
