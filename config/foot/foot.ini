# ==============================================================================
# ALPORA Foot Terminal Configuration (foot.ini)
# ==============================================================================
# Fast, lightweight Wayland native terminal.

# Font configuration
font=JetBrains Mono:size=11, Noto Color Emoji:size=11
font-bold=JetBrains Mono:size=11:weight=bold
font-italic=JetBrains Mono:size=11:slant=italic

pad=14x14 center
dpi-aware=yes

[environment]
# Environment variables for child process
COLORTERM=truecolor

[bell]
urgent=yes
notify=yes

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
color=18201f 859e92

[colors]
alpha=0.92
foreground=d6e0db
background=141a18

## Normal/regular colors (semantic ALPORA tones)
regular0=1c2321  # black
regular1=c26960  # red
regular2=7ea286  # green (accent)
regular3=cca372  # yellow
regular4=6890a8  # blue
regular5=9f7ca6  # magenta
regular6=6d9fa1  # cyan
regular7=c7d2cd  # white

## Bright colors
bright0=36433f   # bright black
bright1=d77f76   # bright red
bright2=94b89c   # bright green
bright3=e0b887   # bright yellow
bright4=7fa5bd   # bright blue
bright5=b593bc   # bright magenta
bright6=84b5b7   # bright cyan
bright7=ecf3f0   # bright white

## Selection
selection-foreground=141a18
selection-background=859e92

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+u

