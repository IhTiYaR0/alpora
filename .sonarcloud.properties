# SonarCloud Automatic Analysis Configuration
# Documentation: https://docs.sonarcloud.io/advanced-setup/automatic-analysis/

# Source and Test scopes
sonar.sources=poly_shell,scripts,shell,dotfiles,install
sonar.tests=tests

# Target Python runtime versions
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Exclude third-party assets, fonts, and audit traces
sonar.exclusions=assets/theme-templates/**,docs/audits/traces/**,assets/fonts/**
