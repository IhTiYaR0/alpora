# ==============================================================================
# ALPORA Foot Terminal Configuration (foot.ini)
# ==============================================================================
# Fast, lightweight Wayland native terminal.

# Font configuration
font=JetBrains Mono:size=11, Noto Color Emoji:size=11
font-bold=JetBrains Mono:size=11:weight=bold
font-italic=JetBrains Mono:size=11:slant=italic

pad=14x14 center
dpi-aware=yes

[environment]
# Environment variables for child process
COLORTERM=truecolor

[bell]
urgent=yes
notify=yes

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
color=18201f 859e92

[colors]
alpha=0.92
foreground=edf0e5
background=202829

## Normal/regular colors (semantic ALPORA tones)
regular0=202829
regular1=d79585
regular2=b8cba1
regular3=dbb48a
regular4=a4c5c5
regular5=f1b791
regular6=aac7ba
regular7=edf0e5

## Bright colors
bright0=b6c0b5
bright1=dba798
bright2=c3d2af
bright3=dfc09c
bright4=b3cecb
bright5=f0c2a2
bright6=b7cfc3
bright7=edf0e5

## Selection
selection-foreground=edf0e5
selection-background=303a36
cursor=202829 f1b791
[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+u

