# ALPORA managed lockscreen configuration
# Theme dynamic colors and geometry
$font = Inter
$displayFont = Outfit

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    font_color = rgb(237, 242, 244)
    inner_color = rgba(24, 31, 39, 0.75)
    outer_color = rgba(168, 213, 188, 0.85)
    check_color = rgb(168, 213, 188)
    fail_color = rgb(241, 139, 130)
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

# Media Player on lockscreen
image {
    monitor =
    path = /tmp/alpora-lock-art.png
    size = 80
    rounding = 12
    border_size = 1
    border_color = rgba(168, 213, 188, 0.4)
    reload_time = 2
    reload_cmd = poly-shell lock-media art
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] poly-shell lock-media title
    color = rgb(237, 242, 244)
    font_family = $font
    font_size = 12
    position = 0, 15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] poly-shell lock-media artist
    color = rgba(237, 242, 244, 0.6)
    font_family = $font
    font_size = 10
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] poly-shell lock-media controls
    color = rgb(168, 213, 188)
    font_family = $font
    font_size = 13
    position = 0, -25
    halign = center
    valign = center
}

