# ==============================================================================
# ALPORA Hyprland Core Configuration (hyprland.conf)
# ==============================================================================
# Designed for ALPORA Shell, Quickshell, Wayland, and Fcitx5 Vietnamese input.
# Documentation: https://wiki.hyprland.org/Configuring/

# ------------------------------------------------------------------------------
# 1. MONITORS
# ------------------------------------------------------------------------------
# Default to preferred resolution and auto placement.
# Custom per-display scaling can be managed via `poly-shell display-project` or Super+P.
monitor = , preferred, auto, 1

# ------------------------------------------------------------------------------
# 2. ENVIRONMENT VARIABLES
# ------------------------------------------------------------------------------
# Wayland and Desktop environment identifiers
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# Qt & GTK Theme coordination
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, gtk3
env = QT_STYLE_OVERRIDE, Fusion
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = GDK_BACKEND, wayland,x11,*
env = CLUTTER_BACKEND, wayland

# Cursor theme and size (Bibata Modern Ice)
env = XCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Bibata-Modern-Ice
env = HYPRCURSOR_SIZE, 24

# Fcitx5 Vietnamese Input Engine (Wayland native)
env = GTK_IM_MODULE, fcitx
env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus

# ------------------------------------------------------------------------------
# 3. AUTOSTART / EXEC-ONCE
# ------------------------------------------------------------------------------
# Systemd & D-Bus activation environments
exec-once = systemctl --user import-environment WAYLAND_DISPLAY DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XCURSOR_THEME XCURSOR_SIZE GTK_IM_MODULE QT_IM_MODULE XMODIFIERS
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XCURSOR_THEME XCURSOR_SIZE GTK_IM_MODULE QT_IM_MODULE XMODIFIERS

# Authentication Agent & Keyring
exec-once = systemctl --user start hyprpolkitagent.service || /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/hyprpolkitagent

# Vietnamese Input Method Daemon
exec-once = fcitx5 -d --replace

# Idle & Screen lock daemon
exec-once = hypridle -c ~/.config/hypr/alpora-hypridle.conf

# ALPORA Shell Service & Initial Theme Wallpaper
exec-once = poly-shell run
exec-once = poly-shell wallpaper

# ------------------------------------------------------------------------------
# 4. INPUT & GESTURES
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.2
}

# ------------------------------------------------------------------------------
# 5. GENERAL & DWINDLE LAYOUT
# ------------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2

    # Semantic ALPORA palette tones
    col.active_border = rgba(6c8e7eeb) rgba(4a6058cc) 45deg
    col.inactive_border = rgba(25302daa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ------------------------------------------------------------------------------
# 6. DECORATION & BLUR
# ------------------------------------------------------------------------------
decoration {
    rounding = 16

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        noise = 0.012
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(12181955)
    }
}

# ------------------------------------------------------------------------------
# 7. ANIMATIONS (Fluent iOS/macOS snappy spring physics)
# ------------------------------------------------------------------------------
animations {
    enabled = true

    bezier = fluent, 0.16, 1.0, 0.3, 1.0
    bezier = snappy, 0.05, 0.9, 0.1, 1.05
    bezier = polyPanel, 0.2, 0.0, 0.2, 1.0

    animation = windows, 1, 4.0, fluent, popin 80%
    animation = windowsOut, 1, 3.0, fluent, popin 85%
    animation = windowsMove, 1, 4.0, fluent
    animation = border, 1, 4.0, default
    animation = fade, 1, 3.0, fluent
    animation = workspaces, 1, 4.5, fluent, slide
}

# ------------------------------------------------------------------------------
# 8. LAYER RULES & WINDOW RULES
# ------------------------------------------------------------------------------
# Quickshell panels: background blur, alpha pass, instant mapping
layerrule = blur, ^(poly-shell(-.*)?)$
layerrule = ignorealpha 0.15, ^(poly-shell(-.*)?)$
layerrule = noanim, ^(poly-shell(-.*)?)$

# Notifications & Overviews
layerrule = blur, ^(notifications)$
layerrule = ignorealpha 0.15, ^(notifications)$
layerrule = blur, ^(poly-workspace-overview)$
layerrule = blur, ^(poly-video-pip)$

# Video Picture-in-Picture floating rules
windowrulev2 = float, title:^(Picture in picture|Picture-in-Picture|ALPORA Video PiP)$
windowrulev2 = pin, title:^(Picture in picture|Picture-in-Picture|ALPORA Video PiP)$
windowrulev2 = keepaspectratio, title:^(Picture in picture|Picture-in-Picture|ALPORA Video PiP)$

# Utility popups floating
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrulev2 = float, class:^(org.gnome.NautilusPreviewer)$

# Quake Dropdown Terminal rules
windowrulev2 = float, class:^(quake-terminal)$
windowrulev2 = move 7.5% 32, class:^(quake-terminal)$
windowrulev2 = size 85% 46%, class:^(quake-terminal)$
windowrulev2 = animation slide top, class:^(quake-terminal)$

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    vfr = true
}

# ------------------------------------------------------------------------------
# 9. KEYBINDINGS
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Terminal & Daily Tools
bind = $mainMod, Return, exec, foot || kitty || alacritty
bind = $mainMod, Grave, togglespecialworkspace, quake
bind = $mainMod, asciitilde, togglespecialworkspace, quake
workspace = special:quake, on-created-empty:foot --app-id=quake-terminal || kitty --class=quake-terminal
bind = $mainMod, E, exec, nautilus --new-window
bind = $mainMod, B, exec, xdg-open https://google.com
bind = $mainMod, L, exec, hyprlock -c ~/.config/hypr/hyprlock.conf
bind = $mainMod, N, exec, nm-connection-editor
bind = $mainMod, A, exec, pavucontrol
bind = $mainMod SHIFT, E, exec, hyprshutdown || loginctl terminate-session self

# ALPORA Shell Controls & Navigation
bind = $mainMod, Space, exec, poly-shell launcher
bind = $mainMod, R, exec, poly-shell launcher
bind = $mainMod, I, exec, poly-shell quick-settings
bind = $mainMod, M, exec, poly-shell notifications
bind = $mainMod, V, exec, poly-shell clipboard
bind = $mainMod, Tab, exec, poly-shell overview
bind = $mainMod, W, exec, poly-shell toggle-mode
bind = $mainMod, P, exec, poly-shell display-project
bind = , XF86Display, exec, poly-shell display-project
bind = $mainMod, Escape, exec, poly-shell power-menu
bind = , XF86PowerOff, exec, poly-shell power-menu
bind = CTRL SHIFT, Escape, exec, poly-shell task-manager
bind = $mainMod, Y, exec, poly-shell video-pip

# Screenshots & Screen tools
bind = , Print, exec, poly-shell screen capture
bind = $mainMod SHIFT, S, exec, poly-shell screen capture
bind = $mainMod CTRL, S, exec, poly-shell screen ocr
bind = $mainMod ALT, S, exec, poly-shell screen record

# Window Operations
bind = $mainMod, Q, killactive
bind = $mainMod, C, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod, J, togglesplit
bind = ALT, Tab, cyclenext

# Directional Window Focus (Super + Arrows / HJKL)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Directional Window Move (Super + Shift + Arrows)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Keyboard Window Resizing
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Workspaces Switch (Super + 1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace (Super + Shift + 1-10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Window Actions
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hardware Keys (Volume, Brightness, Media)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

